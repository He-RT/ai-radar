[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zhenfu-ai-radar-api"
version = "0.1.0"
description = "Evidence-first backend for the Zhenfu AI Radar"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.36,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.115,<1",
  "httpcore>=1,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<9",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pyright>=1.1.400,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zhenfu_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["zhenfu_api"]

[tool.ruff]
target-version = "py313"
line-length = 100
