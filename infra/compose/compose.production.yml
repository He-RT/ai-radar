name: amplitude-radar

x-default-logging: &default-logging
  # Promtail reads Docker's bounded JSON files; changing this driver requires
  # changing and re-validating infra/observability/promtail/config.yml as well.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-security: &app-security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  logging: *default-logging

x-common-runtime-environment: &common-runtime-environment
  RADAR_ENVIRONMENT: production
  RADAR_LOG_FORMAT: json
  RADAR_SYNTHETIC_REPOSITORY: "false"

services:
  caddy:
    image: "${CADDY_IMAGE:?CADDY_IMAGE is required}"
    restart: unless-stopped
    read_only: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required}"
      CADDY_EMAIL: "${CADDY_EMAIL:?CADDY_EMAIL is required}"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
      app:
        ipv4_address: 172.30.0.2
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    <<: *app-security
    image: "${WEB_IMAGE:?WEB_IMAGE is required}@${WEB_IMAGE_DIGEST:?WEB_IMAGE_DIGEST is required}"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: /api
      RADAR_DATA_MODE: api
      API_ORIGIN: http://api:8000
      RADAR_PUBLIC_BASE_URL: "${RADAR_PUBLIC_BASE_URL:?RADAR_PUBLIC_BASE_URL is required}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /app/apps/web/.next/cache:rw,nosuid,nodev,noexec,size=256m
    networks:
      - app
    mem_limit: 768m
    cpus: "0.75"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  migrate:
    <<: *app-security
    image: "${API_IMAGE:?API_IMAGE is required}@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST is required}"
    restart: "no"
    command: ["/bin/sh", "-ec", "${RADAR_MIGRATE_COMMAND:-alembic upgrade head}"]
    environment:
      <<: *common-runtime-environment
      # Alembic owns the schema and is the only application workload with DDL rights.
      RADAR_DATABASE_URL: "postgresql+psycopg://${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}:${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      RADAR_SERVICE_ROLE: migrate
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    cpus: "0.50"

  api:
    <<: *app-security
    image: "${API_IMAGE:?API_IMAGE is required}@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST is required}"
    restart: unless-stopped
    command: ["uvicorn", "zhenfu_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=172.30.0.2"]
    expose:
      - "8000"
    environment:
      <<: *common-runtime-environment
      RADAR_SERVICE_ROLE: api
      RADAR_PUBLIC_BASE_URL: "${RADAR_PUBLIC_BASE_URL:?RADAR_PUBLIC_BASE_URL is required}"
      RADAR_CORS_ORIGINS: '["${RADAR_PUBLIC_BASE_URL:?RADAR_PUBLIC_BASE_URL is required}"]'
      RADAR_APP_SECRET_KEY: "${RADAR_APP_SECRET_KEY:?RADAR_APP_SECRET_KEY is required}"
      RADAR_DATABASE_URL: "postgresql+psycopg://${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      RADAR_VALKEY_URL: "redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}@valkey:6379/0"
      RADAR_SMTP_URL: smtp://mailpit:1025
      PORT: "8000"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    networks:
      - app
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1536m
    cpus: "1.25"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker-ingest:
    <<: *app-security
    image: "${WORKER_IMAGE:?WORKER_IMAGE is required}@${WORKER_IMAGE_DIGEST:?WORKER_IMAGE_DIGEST is required}"
    restart: unless-stopped
    command: ["/bin/sh", "-ec", "${RADAR_INGEST_WORKER_COMMAND:-python -m zhenfu_api.workers.ingest}"]
    environment:
      <<: *common-runtime-environment
      RADAR_SERVICE_ROLE: ingest-worker
      RADAR_SOURCE_CATALOG_PATH: /app/config/sources/ai_radar_sources.json
      RADAR_DATABASE_URL: "postgresql+psycopg://${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      RADAR_VALKEY_URL: "redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}@valkey:6379/0"
      RADAR_S3_ENDPOINT: http://minio:9000
      RADAR_S3_ACCESS_KEY: "${RADAR_S3_ACCESS_KEY:?RADAR_S3_ACCESS_KEY is required}"
      RADAR_S3_SECRET_KEY: "${RADAR_S3_SECRET_KEY:?RADAR_S3_SECRET_KEY is required}"
      RADAR_S3_BUCKET: "${MINIO_BUCKET:?MINIO_BUCKET is required}"
      RADAR_S3_PUBLIC_ENDPOINT: "${RADAR_S3_PUBLIC_ENDPOINT:-}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    networks:
      - data
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1024m
    cpus: "0.75"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; from zhenfu_api.jobs import celery_app; name='ingest@'+os.uname().nodename; sys.exit(0 if celery_app.control.ping(destination=[name], timeout=3) else 1)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s

  worker-enrichment:
    <<: *app-security
    image: "${WORKER_IMAGE:?WORKER_IMAGE is required}@${WORKER_IMAGE_DIGEST:?WORKER_IMAGE_DIGEST is required}"
    restart: unless-stopped
    command: ["/bin/sh", "-ec", "${RADAR_ENRICHMENT_WORKER_COMMAND:-python -m zhenfu_api.workers.enrichment}"]
    environment:
      <<: *common-runtime-environment
      RADAR_SERVICE_ROLE: enrichment-worker
      RADAR_DATABASE_URL: "postgresql+psycopg://${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      RADAR_VALKEY_URL: "redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}@valkey:6379/0"
      RADAR_S3_ENDPOINT: http://minio:9000
      RADAR_S3_ACCESS_KEY: "${RADAR_S3_ACCESS_KEY:?RADAR_S3_ACCESS_KEY is required}"
      RADAR_S3_SECRET_KEY: "${RADAR_S3_SECRET_KEY:?RADAR_S3_SECRET_KEY is required}"
      RADAR_S3_BUCKET: "${MINIO_BUCKET:?MINIO_BUCKET is required}"
      RADAR_S3_PUBLIC_ENDPOINT: "${RADAR_S3_PUBLIC_ENDPOINT:-}"
      RADAR_LLM_API_KEY: "${RADAR_LLM_API_KEY:?RADAR_LLM_API_KEY is required}"
      RADAR_LLM_BASE_URL: "${RADAR_LLM_BASE_URL:-https://api.openai.com/v1}"
      RADAR_LLM_MODEL: "${RADAR_LLM_MODEL:?RADAR_LLM_MODEL is required}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    networks:
      - data
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1024m
    cpus: "0.75"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; from zhenfu_api.jobs import celery_app; name='enrichment@'+os.uname().nodename; sys.exit(0 if celery_app.control.ping(destination=[name], timeout=3) else 1)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s

  postgres:
    image: "${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}"
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_MIGRATION_USER: "${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}"
      POSTGRES_MIGRATION_PASSWORD: "${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}"
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}"
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      # PostgreSQL 18 stores cluster data under a major-version subdirectory.
      # Mount the parent so pg_upgrade can operate without a volume boundary.
      - postgres_data:/var/lib/postgresql
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    mem_limit: 3072m
    cpus: "1.25"
    shm_size: 256mb
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  valkey:
    image: "${VALKEY_IMAGE:?VALKEY_IMAGE is required}"
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - "${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}"
    volumes:
      - valkey_data:/data
    networks:
      - data
    mem_limit: 512m
    cpus: "0.35"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"${VALKEY_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: "${MINIO_IMAGE:?MINIO_IMAGE is required}"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    volumes:
      - minio_data:/data
    networks:
      - data
    mem_limit: 1024m
    cpus: "0.50"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    image: "${MINIO_MC_IMAGE:?MINIO_MC_IMAGE is required}"
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        set -eu;
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET}";
        mc anonymous set none "local/$${MINIO_BUCKET}";
        policy_file=$$(mktemp);
        trap 'rm -f "$$policy_file"' EXIT;
        printf '%s\n' '{' '  "Version": "2012-10-17",' '  "Statement": [' '    {' '      "Effect": "Allow",' '      "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],' '      "Resource": ["arn:aws:s3:::'"$${MINIO_BUCKET}"'"]' '    },' '    {' '      "Effect": "Allow",' '      "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],' '      "Resource": ["arn:aws:s3:::'"$${MINIO_BUCKET}"'/*"]' '    }' '  ]' '}' > "$$policy_file";
        mc admin user add local "$${RADAR_S3_ACCESS_KEY}" "$${RADAR_S3_SECRET_KEY}";
        mc admin policy create local radar-app-bucket "$$policy_file" || mc admin policy update local radar-app-bucket "$$policy_file";
        mc admin policy attach local radar-app-bucket --user "$${RADAR_S3_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:?MINIO_BUCKET is required}"
      RADAR_S3_ACCESS_KEY: "${RADAR_S3_ACCESS_KEY:?RADAR_S3_ACCESS_KEY is required}"
      RADAR_S3_SECRET_KEY: "${RADAR_S3_SECRET_KEY:?RADAR_S3_SECRET_KEY is required}"
    networks:
      - data
    depends_on:
      minio:
        condition: service_healthy
    logging: *default-logging

  # This helper is only started by backup/restore scripts with --profile maintenance.
  minio-client:
    profiles: ["maintenance"]
    image: "${MINIO_MC_IMAGE:?MINIO_MC_IMAGE is required}"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:?MINIO_BUCKET is required}"
    volumes:
      - "${BACKUP_STAGING_DIR:-/tmp/amplitude-radar-backup-staging}:/backup"
    networks:
      - data
    logging: *default-logging

  # Mailpit intentionally captures mail instead of delivering it. Keep it enabled until
  # an approved transactional-email provider and its incident controls are integrated.
  mailpit:
    <<: *app-security
    image: "${MAILPIT_IMAGE:?MAILPIT_IMAGE is required}"
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "0"
    networks:
      - app
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    mem_limit: 256m
    cpus: "0.20"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8025/livez || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6

  prometheus:
    profiles: ["observability"]
    image: "${PROMETHEUS_IMAGE:?PROMETHEUS_IMAGE is required}"
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app
      - monitoring
    mem_limit: 768m
    cpus: "0.40"
    logging: *default-logging

  grafana:
    profiles: ["observability"]
    image: "${GRAFANA_IMAGE:?GRAFANA_IMAGE is required}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    mem_limit: 768m
    cpus: "0.35"
    logging: *default-logging

  loki:
    profiles: ["observability"]
    image: "${LOKI_IMAGE:?LOKI_IMAGE is required}"
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ../observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    mem_limit: 1024m
    cpus: "0.40"
    logging: *default-logging

  promtail:
    profiles: ["observability"]
    image: "${PROMTAIL_IMAGE:?PROMTAIL_IMAGE is required}"
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ../observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/positions
    networks:
      - monitoring
    mem_limit: 256m
    cpus: "0.20"
    logging: *default-logging

  node-exporter:
    profiles: ["observability"]
    image: "${NODE_EXPORTER_IMAGE:?NODE_EXPORTER_IMAGE is required}"
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - monitoring
    mem_limit: 256m
    cpus: "0.20"
    logging: *default-logging

networks:
  edge:
  app:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic services allocate only from the upper half; Caddy's trusted
          # proxy address 172.30.0.2 is therefore reserved before startup.
          ip_range: 172.30.0.128/25
  data:
    internal: true
  egress:
  monitoring:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
